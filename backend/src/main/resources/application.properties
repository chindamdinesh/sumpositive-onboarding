spring.application.name=employeeonboarding
# Load local secret overrides if application-local.properties exists (Ignored by Git!)
spring.config.import=optional:classpath:application-local.properties

server.port=${SERVER_PORT:8080}

# 1. PostgreSQL Database Connection (Uses Environment Variables with local defaults)
spring.datasource.url=jdbc:postgresql://localhost:5432/sumpositive_onboarding
spring.datasource.username=${DB_USERNAME:app_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. JPA / Hibernate Configuration
# 'update' verifies/updates schema without dropping tables; 'validate' checks that Entities match SQL tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. JWT Security Configuration
# Must be at least 32 characters (256 bits) for HS256 signing
app.jwt.secret=${JWT_SECRET:SumpositiveLocalDevSecretKeyMustBeAtLeast32BytesLong2026!}
# 3600000 ms = 1 hour expiration
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
